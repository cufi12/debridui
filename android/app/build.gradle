plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { value -> value != null && !value.trim().isEmpty() }

android {
    namespace 'com.debridui.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.debridui.tv'
        minSdk 23
        targetSdk 28
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName = (System.getenv('APP_VERSION_NAME') ?: '1.0.0').replaceFirst('^tv-v', '')
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
