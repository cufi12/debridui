name: Verify

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, staging, plugin-runtime-quickjs]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Verification needs to publish the required "verify" commit status after all
# checks pass. It still cannot push commits or modify repository contents.
permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and lint
        run: bun run verify

      - name: Test provider IPv4 SSRF protections
        run: bun scripts/provider-ipv4-ssrf-test.ts

      - name: Smoke-test QuickJS provider runtime
        run: bun scripts/provider-runtime-smoke.ts

      # The repository ruleset currently expects a classic commit status named
      # "verify". Publish it only after every verification step has succeeded.
      - name: Publish required verify commit status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.eventName === "pull_request"
              ? context.payload.pull_request.head.sha
              : context.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: "success",
              context: "verify",
              description: "All verification steps passed."
            });
