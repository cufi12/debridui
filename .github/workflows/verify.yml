name: Verify

on:
  push:
    branches: [main, staging, plugin-runtime-quickjs]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Commit lockfile updates
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: update bun lockfile"
            git push
          fi

      - name: Apply safe formatting and lint fixes
        run: bun run check:fix

      - name: Commit formatting fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: apply Biome fixes"
            git push
          fi

      - name: Typecheck and lint
        run: bun run verify

      - name: Smoke-test QuickJS provider runtime
        run: bun --conditions=react-server scripts/provider-runtime-smoke.ts
