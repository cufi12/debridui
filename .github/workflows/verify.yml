name: Verify

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, staging, plugin-runtime-quickjs]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Verification must never need to write back to the repository. In particular,
# code from a pull request must not receive a token capable of pushing commits.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and lint
        run: bun run verify

      - name: Smoke-test QuickJS provider runtime
        run: bun scripts/provider-runtime-smoke.ts
