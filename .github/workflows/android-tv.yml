name: Build DebridUI Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-tv.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android TV APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Build Android Smartphone APK
        run: gradle -p android :mobile:assembleDebug --no-daemon

      - name: Prepare APKs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DebridUI-TV.apk
          cp android/mobile/build/outputs/apk/debug/mobile-debug.apk DebridUI-Android.apk

      - name: Publish APK downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-latest
          name: DebridUI Android Apps
          body: |
            DebridUI Android TV and Smartphone wrappers for https://debridui.onrender.com.
            Install DebridUI-TV.apk on Android TV.
            Install DebridUI-Android.apk on Android smartphones.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            DebridUI-TV.apk
            DebridUI-Android.apk
