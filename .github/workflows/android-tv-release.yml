name: Release DebridUI Android TV

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-tv-release.yml"
  push:
    tags:
      - "tv-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate release signing secrets
        if: startsWith(github.ref, 'refs/tags/tv-v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing required repository secret: $secret_name"
              exit 1
            fi
          done

      - name: Prepare and verify signing key
        if: startsWith(github.ref, 'refs/tags/tv-v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/debridui-release.keystore"

          # GitHub secrets may contain wrapped Base64; remove whitespace before decoding.
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64. Re-encode the original keystore file and update the repository secret."
            exit 1
          fi

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded Android keystore is empty."
            exit 1
          fi

          # Confirm that the file is a readable keystore and the configured alias exists.
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The decoded keystore, store password, or key alias is invalid. Check the existing signing credentials."
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gradle -p android :app:assembleRelease --no-daemon
          if [[ "$GITHUB_REF" == refs/tags/tv-v* ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk DebridUI-TV.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk DebridUI-TV-unsigned.apk
          fi

      - name: Upload unsigned pull request build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DebridUI-TV-unsigned
          path: DebridUI-TV-unsigned.apk
          if-no-files-found: error

      - name: Upload signed release candidate
        if: startsWith(github.ref, 'refs/tags/tv-v')
        uses: actions/upload-artifact@v4
        with:
          name: DebridUI-TV-release
          path: DebridUI-TV.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/tv-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: DebridUI-TV-release

      - name: Publish signed Android TV release
        uses: softprops/action-gh-release@v2
        with:
          name: DebridUI Android TV ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: DebridUI-TV.apk
